# ── Formelsamling ────────────────────────────────────────────────────────────
# Eksamen deler ikke ut formelark (hjelpemiddelkode H, og settene i arkivet har
# ingen formelside), så exam.formulaSheet er false og radene får ingen merker.
formulas:
  - id: newtons-andre
    section: Inertialsystemer
    tex: "\\vec F = \\dot{\\vec p} = m\\ddot{\\vec r}"
    label: "Newtons andre lov for konstant masse. Akselerasjonen på høyresiden måles i ett bestemt system, og loven sier ingenting før du har sagt hvilket."
  - id: lineaer-transformasjon
    section: Inertialsystemer
    tex: "t' = At + Bx, \\qquad x' = A\\,(x - vt)"
    label: "Den mest generelle lineære transformasjonen mellom to inertialsystemer med parallelle akser og felles origo ved $t = 0$. Samme krav binder konstantene med $A^2 + ABv = 1$, så bare én av dem er fri."
  - id: galilei
    section: Inertialsystemer
    tex: "t' = t, \\qquad \\vec r\\,' = \\vec r - \\vec v t"
    label: "<b>Galilei-transformasjonen</b>, altså valget $A = 1$ og $B = 0$. Den følger av at tida regnes som absolutt."
  - id: galilei-hastighet
    section: Inertialsystemer
    tex: "\\vec u\\,' = \\vec u - \\vec v, \\qquad \\vec a\\,' = \\vec a"
    label: "Hastigheter forskyves med $\\vec v$, mens akselerasjonen er den samme i begge systemer. Derfor har $m\\vec a = \\vec F$ samme form i alle inertialsystemer."
  - id: arbeid
    section: Krefter og potensial
    tex: "W = \\int_C \\vec F \\cdot d\\vec r"
    label: "Arbeidet kraften gjør langs banen $C$. For en vilkårlig kraft avhenger tallet av hele banen."
  - id: virvelfri
    section: Krefter og potensial
    tex: "\\nabla \\times \\vec F = 0"
    label: "Testen for om en kraft er konservativ. På et <em>enkeltsammenhengende</em> område er betingelsen både nødvendig og tilstrekkelig."
  - id: konservativ
    section: Krefter og potensial
    tex: "\\vec F = -\\nabla V"
    label: "Kraften som gradienten av et potensial. Arbeidet blir $V(a) - V(b)$ og avhenger bare av endepunktene."
  - id: energi-1d
    section: Bevegelse i et potensial
    tex: "E = \\tfrac12 m\\dot x^2 + V(x)"
    label: "Bevart energi i én dimensjon. Det kinetiske leddet kan ikke være negativt, så partikkelen holder seg der $V(x) \\le E$."
  - id: likevekt
    section: Bevegelse i et potensial
    tex: "V'(x_0) = 0, \\qquad \\omega = \\sqrt{V''(x_0)/m}"
    label: "Likevekt der $V'$ har et nullpunkt. $V''(x_0) > 0$ gir et minimum og en stabil likevekt med små svingninger av vinkelfrekvens $\\omega$, mens $V''(x_0) < 0$ gir en ustabil topp."
  - id: green-respons
    section: Greens funksjon
    tex: "x(t) = \\int_{-\\infty}^{\\infty} dt'\\, G_R(t - t')\\, J(t')"
    label: "Responsen på en vilkårlig kraft $J(t)$, satt sammen som en superposisjon av responser på deltadytt. Krever at bevegelsesligningen er lineær."
  - id: green-invers
    section: Greens funksjon
    tex: "D(t)\\, G_R(t - t') = \\delta(t - t')"
    label: "Greens funksjonen inverterer differensialoperatoren $D(t)$ i bevegelsesligningen $D(t)\\,x(t) = J(t)$."
  - id: green-oscillator
    section: Greens funksjon
    tex: "G_R(\\tau) = \\frac{1}{m}\\, \\frac{\\sin(\\omega\\tau)}{\\omega}\\, \\theta(\\tau)"
    label: "Retardert Greens funksjon for den harmoniske oscillatoren. Trinnfunksjonen $\\theta$ gjør at responsen kommer etter dyttet."
  - id: massesenter
    section: Partikkelsystemer
    tex: "\\vec R = \\frac{1}{M} \\sum_i m_i \\vec r_i, \\qquad \\vec P = M \\dot{\\vec R}"
    label: "Massesenteret og den totale impulsen til et partikkelsystem, med $M = \\sum_i m_i$."
  - id: massesenter-bevegelse
    section: Partikkelsystemer
    tex: "\\dot{\\vec P} = \\sum_i \\vec F_i^{(e)}"
    label: "De indre kreftene opphever hverandre parvis, så bare de ytre kreftene flytter massesenteret. Er summen null, er den totale impulsen bevart."
  - id: dreieimpuls-ytre
    section: Partikkelsystemer
    tex: "\\frac{d\\vec L}{dt} = \\vec N^{(e)}"
    label: "For sentrale indre krefter endres den totale dreieimpulsen bare av det ytre dreiemomentet $\\vec N^{(e)} = \\sum_i \\vec r_i \\times \\vec F_i^{(e)}$."
  - id: kinetisk-splitt
    section: Partikkelsystemer
    tex: "T = \\tfrac12 M \\dot{\\vec R}^2 + \\tfrac12 \\sum_i m_i \\dot{\\vec y}_i^{\\,2}"
    label: "Kinetisk energi delt i massesenterets bevegelse og bevegelsen rundt massesenteret, med $\\vec y_i = \\vec r_i - \\vec R$."
  - id: redusert-masse
    section: Partikkelsystemer
    tex: "\\mu \\ddot{\\vec r} = \\vec F_{12}, \\qquad \\mu = \\frac{m_1 m_2}{m_1 + m_2}"
    label: "Tolegemeproblemet uten ytre krefter, redusert til ett legeme med redusert masse $\\mu$ for relativkoordinaten $\\vec r = \\vec r_1 - \\vec r_2$."
  - id: kraftstot
    section: Støt
    tex: "\\vec I = \\int \\vec F\\, dt = \\Delta\\vec p"
    label: "Kraftstøtet er tidsintegralet av kraften over støtet og er lik endringen i impuls."
  - id: elastisk-rett-vinkel
    section: Støt
    tex: "\\vec v_1 \\cdot \\vec v_2 = 0"
    label: "Elastisk støt mellom like masser der den ene starter i ro: enten stopper den første, eller de to går ut vinkelrett på hverandre."
  - id: frihetsgrader
    section: Lagrangeformalismen
    tex: "n = 3N - k"
    label: "Antall frihetsgrader for $N$ partikler med $k$ holonome føringer. De beskrives av generaliserte koordinater $q_1, \\dots, q_n$."
  - id: sfaerisk-pendel
    section: Lagrangeformalismen
    tex: "L = \\tfrac12 ml^2\\left(\\dot\\theta^2 + \\dot\\phi^2\\sin^2\\theta\\right) + mgl\\cos\\theta"
    label: "Den sfæriske pendelen med $\\theta$ fra loddlinja og $\\phi$ rundt den. $L$ avhenger ikke av $\\phi$, så $ml^2\\dot\\phi\\sin^2\\theta$, dreieimpulsen om loddlinja, er konstant."
  - id: lagrangefunksjon
    section: Lagrangeformalismen
    tex: "L = T - V"
    label: "Lagrangefunksjonen, kinetisk energi minus potensiell energi. Minustegnet skiller den fra den totale energien."
  - id: virkning
    section: Lagrangeformalismen
    tex: "S[q] = \\int_{t_1}^{t_2} L(q, \\dot q, t)\\, dt"
    label: "Virkningen gir hver bane mellom faste endepunkter ved faste tider ett tall. Den virkelige banen gjør $S$ stasjonær, $\\delta S = 0$."
  - id: euler-lagrange
    section: Lagrangeformalismen
    tex: "\\frac{d}{dt}\\frac{\\partial L}{\\partial \\dot q_i} - \\frac{\\partial L}{\\partial q_i} = 0"
    label: "Lagranges ligninger, én for hver generalisert koordinat. De følger av $\\delta S = 0$ og har samme form i alle koordinatsystemer."
  - id: ekvivalente-lagrangefunksjoner
    section: Lagrangeformalismen
    tex: "L' = \\alpha L, \\qquad L' = L + \\frac{df(q, t)}{dt}"
    label: "Lagrangefunksjoner som gir samme bevegelsesligninger som $L$. Virkningen endres med en faktor eller med randleddet $f(q_2, t_2) - f(q_1, t_1)$, som er likt for alle baner med faste endepunkter."
  - id: lagrange-ladd-partikkel
    section: Lagrangeformalismen
    tex: "L = \\tfrac12 m\\dot{\\vec r}^2 + q\\,\\dot{\\vec r} \\cdot \\vec A - q\\phi"
    label: "Ladd partikkel i et elektromagnetisk felt, med $\\vec E = -\\nabla\\phi - \\partial\\vec A/\\partial t$ og $\\vec B = \\nabla \\times \\vec A$. Lagranges ligninger gir Lorentzkraften $m\\ddot{\\vec r} = q(\\vec E + \\dot{\\vec r} \\times \\vec B)$."
  - id: gaugetransformasjon
    section: Lagrangeformalismen
    tex: "\\vec A \\to \\vec A + \\nabla\\chi, \\qquad \\phi \\to \\phi - \\frac{\\partial\\chi}{\\partial t}"
    label: "Gaugetransformasjon av potensialene med en vilkårlig funksjon $\\chi(\\vec r, t)$. $\\vec E$ og $\\vec B$ er uendret, og $L$ endres med $q\\,d\\chi/dt$, en total tidsderivert, så bevegelsen er den samme."
  - id: lagrange-multiplikator
    section: Lagrangeformalismen
    tex: "\\frac{d}{dt}\\frac{\\partial L}{\\partial \\dot q_k} - \\frac{\\partial L}{\\partial q_k} = \\sum_\\alpha \\lambda_\\alpha \\frac{\\partial f_\\alpha}{\\partial q_k}"
    label: "Lagranges ligninger med multiplikatorer for føringene $f_\\alpha(q, t) = 0$, fra $L' = L + \\sum_\\alpha \\lambda_\\alpha f_\\alpha$. Høyresida er føringskraften i retning $q_k$; for pendelen med $f = r - l$ er $\\lambda = -S$, snorkraften med motsatt fortegn."

  - id: rotasjon-tidsderivert
    section: Roterende referansesystemer
    tex: "\\left(\\frac{d\\vec A}{dt}\\right)_{K} = \\left(\\frac{d\\vec A}{dt}\\right)_{K'} + \\vec\\omega \\times \\vec A"
    label: "Den tidsderiverte av en vilkårlig vektor i inertialsystemet $K$ og i systemet $K'$ som roterer med vinkelhastigheten $\\vec\\omega$. Enhetsvektorene i $K'$ følger rotasjonen, $\\dot{\\hat e}_i' = \\vec\\omega \\times \\hat e_i'$."
  - id: hastighet-roterende
    section: Roterende referansesystemer
    tex: "\\vec v = \\vec v\\,' + \\vec\\omega \\times \\vec r"
    label: "Hastigheten i $K$ er hastigheten målt i det roterende systemet pluss farten $\\vec\\omega \\times \\vec r$ til det medroterende punktet."
  - id: akselerasjon-roterende
    section: Roterende referansesystemer
    tex: "\\vec a = \\vec a\\,' + 2\\,\\vec\\omega \\times \\vec v\\,' + \\dot{\\vec\\omega} \\times \\vec r + \\vec\\omega \\times (\\vec\\omega \\times \\vec r)"
    label: "Akselerasjonen i $K$ uttrykt ved størrelser målt i $K'$. Det siste leddet er $-\\omega^2\\vec d$ med $\\vec d$ vinkelrett fra aksen, altså sentripetalakselerasjonen for et medroterende punkt."
  - id: newton-roterende
    section: Roterende referansesystemer
    tex: "m\\vec a\\,' = \\vec F - 2m\\,\\vec\\omega \\times \\vec v\\,' - m\\,\\vec\\omega \\times (\\vec\\omega \\times \\vec r) - m\\,\\dot{\\vec\\omega} \\times \\vec r"
    label: "Newtons andre lov i et roterende system. De tre ekstra leddene er Corioliskraften, sentrifugalkraften og Eulerkraften; de er proporsjonale med $m$ og har ingen motkraft."
  - id: sentrifugalkraft
    section: Roterende referansesystemer
    tex: "\\vec F_\\text{s} = m\\omega^2\\vec d = -\\nabla V_\\text{s}, \\qquad V_\\text{s} = -\\tfrac12 m\\,|\\vec\\omega \\times \\vec r|^2"
    label: "Sentrifugalkraften peker ut fra aksen med størrelsen $m\\omega^2 d$ og er konservativ med potensialet $-\\tfrac12 m\\omega^2 d^2$. Vannflaten i ei roterende bøtte er paraboloiden $z = z_0 + \\omega^2 r^2/2g$."
  - id: effektiv-tyngde
    section: Roterende referansesystemer
    tex: "\\vec g_\\text{eff} = \\vec g - \\vec\\omega \\times (\\vec\\omega \\times \\vec R), \\qquad \\tan\\alpha \\approx \\frac{\\omega^2 R\\sin\\phi\\cos\\phi}{g}"
    label: "Den effektive tyngdeakselerasjonen på breddegraden $\\phi$, og vinkelen loddlinja avviker fra retningen mot sentrum. $\\omega^2 R = 3{,}4$ cm/s² for jorda, og $\\alpha$ er størst ved $45°$, omtrent $0{,}1°$."
  - id: corioliskraft
    section: Roterende referansesystemer
    tex: "\\vec F_\\text{C} = -2m\\,\\vec\\omega \\times \\vec v\\,', \\qquad F_\\text{C,\\,horisontal} = 2m\\omega v\\sin\\phi"
    label: "Corioliskraften står vinkelrett på $\\vec v\\,'$ og gjør ikke arbeid. For bevegelse langs bakken på breddegraden $\\phi$ peker den horisontale komponenten mot høyre for fartsretningen på den nordlige halvkula."
  - id: fall-avboyning
    section: Roterende referansesystemer
    tex: "d = \\tfrac13\\, g\\omega\\cos\\phi\\, t^3, \\qquad t = \\sqrt{2h/g}"
    label: "Avbøyningen mot øst for et legeme som faller fra ro fra høyden $h$, til første orden i $\\omega$. Fra $\\ddot{\\vec r} = \\vec g - 2\\vec\\omega \\times \\vec g\\,t$ integrert to ganger."
  - id: foucault
    section: Roterende referansesystemer
    tex: "\\Omega_\\text{F} = \\omega\\sin\\phi, \\qquad T_\\text{F} = \\frac{24\\ \\text{h}}{\\sin\\phi}"
    label: "Foucaults pendel: svingeplanet dreier med klokka på den nordlige halvkula med vinkelfarten $\\omega\\sin\\phi$. Løsningen er $x + iy = e^{-i\\omega\\sin\\phi\\,t}(A\\cos\\omega_0 t + B\\sin\\omega_0 t)$."
  - id: larmor
    section: Roterende referansesystemer
    tex: "\\vec\\omega_\\text{L} = -\\frac{q\\vec B}{2m}"
    label: "Larmor-presesjonen. I systemet som roterer med $\\vec\\omega_\\text{L}$ opphever Corioliskraften magnetkraften $q\\vec v\\,' \\times \\vec B$, og banen i et svakt felt er den upåvirkede banen som dreier om feltretningen."

  - id: generalisert-impuls
    section: Symmetrier og bevarte størrelser
    tex: "p_i = \\frac{\\partial L}{\\partial\\dot q_i}, \\qquad \\dot p_i = \\frac{\\partial L}{\\partial q_i}"
    label: "Den generaliserte impulsen til $q_i$, og Lagranges ligning skrevet med den. Mangler $q_i$ i $L$, er koordinaten syklisk og $p_i$ bevart. For den ladde partikkelen er $\\vec p = m\\dot{\\vec r} + q\\vec A$."
  - id: energifunksjon
    section: Symmetrier og bevarte størrelser
    tex: "\\begin{aligned} H &= \\sum_i \\dot q_i\\,\\frac{\\partial L}{\\partial\\dot q_i} - L \\\\ \\frac{dH}{dt} &= -\\frac{\\partial L}{\\partial t} \\end{aligned}"
    label: "Energifunksjonen. Bevart når $L$ ikke avhenger eksplisitt av tida, og lik $T + V$ når føringene er tidsuavhengige og $V$ ikke avhenger av hastighetene."
  - id: lagrange-roterende
    section: Symmetrier og bevarte størrelser
    tex: "\\begin{aligned} &L = \\tfrac12 m\\left(\\vec v\\,' + \\vec\\omega \\times \\vec r\\right)^2 - V \\\\ &H = \\tfrac12 mv'^2 + V - \\tfrac12 m\\,|\\vec\\omega \\times \\vec r|^2 \\end{aligned}"
    label: "Lagrangefunksjonen i et system som roterer med konstant $\\vec\\omega$, med $\\vec v\\,'$ målt i det roterende systemet. Lagranges ligninger gir Corioliskraften og sentrifugalkraften, $\\vec p = m\\vec v$ er impulsen i inertialsystemet, og energifunksjonen inneholder sentrifugalpotensialet."
  - id: noether
    section: Symmetrier og bevarte størrelser
    tex: "\\begin{aligned} &q_i \\to q_i + \\epsilon F_i, \\qquad \\delta L = \\epsilon\\,\\frac{dF}{dt} \\\\ &Q = \\sum_i p_i F_i - F = \\text{konst} \\end{aligned}"
    label: "Noethers teorem. Forskyvning av alle partikler langs $\\hat n$ gir $\\vec P \\cdot \\hat n$, rotasjon om $\\hat n$ gir $\\vec L \\cdot \\hat n$, og en syklisk koordinat $q_j$ er tilfellet $F_i = \\delta_{ij}$, $F = 0$."

  - id: sentralkraft-lagrange
    section: Tolegemeproblemet
    tex: "\\begin{aligned} L &= \\tfrac12\\mu\\left(\\dot r^2 + r^2\\dot\\phi^2\\right) - V(r) \\\\ J &= p_\\phi = \\mu r^2\\dot\\phi \\end{aligned}"
    label: "Relativbevegelsen i tolegemeproblemet, i planet vinkelrett på dreieimpulsen, med redusert masse $\\mu = m_1 m_2/(m_1 + m_2)$. $\\phi$ er syklisk, og $J$ er dreieimpulsen. Arealfarten $\\tfrac12 r^2\\dot\\phi = J/2\\mu$ er konstant, som er Keplers andre lov."
  - id: effektivt-potensial
    section: Tolegemeproblemet
    tex: "\\begin{aligned} E &= \\tfrac12\\mu\\dot r^2 + V_\\text{eff}(r) \\\\ V_\\text{eff}(r) &= V(r) + \\frac{J^2}{2\\mu r^2} \\end{aligned}"
    label: "Den bevarte dreieimpulsen gjør radialbevegelsen til et endimensjonalt problem i et effektivt potensial. Sirkelbanen ligger der $V_\\text{eff}' = 0$; for $V = -k/r$ er radien $r_0 = J^2/\\mu k$ og energien $-\\mu k^2/2J^2$."
  - id: sirkelbane-stabil
    section: Tolegemeproblemet
    tex: "\\begin{aligned} \\omega_r^2 &= \\frac{V_\\text{eff}''(r_0)}{\\mu} \\\\ &= \\frac{1}{\\mu}\\left(V''(r_0) + \\frac{3}{r_0}V'(r_0)\\right) \\end{aligned}"
    label: "Små radielle svingninger om sirkelbanen med radius $r_0$. Banen er stabil når $\\omega_r^2 > 0$; for $V = -k/r^n$ krever det $n < 2$. I $V = -k/r$ er $\\omega_r$ lik vinkelfarten i banen, så den forstyrrede banen er lukket."
  - id: baneligning
    section: Tolegemeproblemet
    tex: "\\frac{d^2u}{d\\phi^2} + u = -\\frac{\\mu}{J^2u^2}\\,F\\!\\left(\\frac1u\\right)"
    label: "Baneligningen for $u = 1/r$, med kraften $F = -V'(r)$. Den gir banens form $r(\\phi)$ uten å gå veien om tida."
  - id: kepler-bane
    section: Tolegemeproblemet
    tex: "\\begin{aligned} r &= \\frac{r_0}{1 + e\\cos\\phi}, \\qquad r_0 = \\frac{J^2}{\\mu k} \\\\ e &= \\sqrt{1 + \\frac{2EJ^2}{\\mu k^2}} \\end{aligned}"
    label: "Banen i $V = -k/r$, et kjeglesnitt med brennpunkt i kraftsentrum og $\\phi = 0$ i perihel. $e = 0$ er sirkelen, $e < 1$ en ellipse ($E < 0$), $e = 1$ en parabel ($E = 0$) og $e > 1$ en hyperbel ($E > 0$)."
  - id: ellipse-akser
    section: Tolegemeproblemet
    tex: "\\begin{aligned} a &= \\frac{k}{2|E|} \\\\ b &= \\frac{J}{\\sqrt{2\\mu|E|}} \\\\ r_\\text{min}, r_\\text{max} &= a(1 \\mp e) \\end{aligned}"
    label: "Halvaksene og apsidene i Keplerellipsen. $a$ avhenger bare av energien, $b$ også av dreieimpulsen, og avstanden fra sentrum til brennpunktet er $ea$."
  - id: keplers-tredje
    section: Tolegemeproblemet
    tex: "\\begin{aligned} T^2 &= \\frac{4\\pi^2\\mu}{k}\\,a^3 \\\\ &= \\frac{4\\pi^2}{G(m_1 + m_2)}\\,a^3 \\end{aligned}"
    label: "Keplers tredje lov, av arealfarten $J/2\\mu$ og ellipsens areal $\\pi ab$. Med $k = Gm_1m_2$ faller massene ut i $\\mu/k = 1/G(m_1 + m_2)$."
  - id: runge-lenz
    section: Tolegemeproblemet
    tex: "\\begin{aligned} \\vec A &= \\vec p \\times \\vec L - \\mu k\\,\\hat r \\\\ |\\vec A| &= \\mu k e \\end{aligned}"
    label: "Runge–Lenz-vektoren, bevart bare for $V = -k/r$. Den ligger i baneplanet og peker mot perihel, og at den er bevart, er grunnen til at Keplerbanen er lukket."
  - id: spredningstverrsnitt
    section: Tolegemeproblemet
    tex: "\\begin{aligned} \\frac{d\\sigma}{d\\Omega} &= \\frac{s}{\\sin\\Theta}\\left|\\frac{ds}{d\\Theta}\\right| \\\\ J &= s\\sqrt{2\\mu E} \\end{aligned}"
    label: "Det differensielle spredningstverrsnittet for et sentralpotensial, med støtparameteren $s$ og spredningsvinkelen $\\Theta$. Partiklene som kommer inn gjennom ringen $2\\pi s\\,ds$ går ut i romvinkelen $2\\pi\\sin\\Theta\\,d\\Theta$."
  - id: rutherford
    section: Tolegemeproblemet
    tex: "\\begin{aligned} s &= \\frac{|k|}{2E}\\cot\\frac{\\Theta}{2} \\\\ \\frac{d\\sigma}{d\\Omega} &= \\left(\\frac{k}{4E}\\right)^2\\frac{1}{\\sin^4(\\Theta/2)} \\end{aligned}"
    label: "Rutherfords spredningsformel for $V = -k/r$ med $k = -qQ/4\\pi\\epsilon_0$. Tverrsnittet vokser uten grense når $\\Theta \\to 0$, fordi Coulombkraften har uendelig rekkevidde."
  - id: virialteoremet
    section: Tolegemeproblemet
    tex: "\\begin{aligned} 2\\langle T\\rangle &= -\\Big\\langle\\sum_i \\vec F_i \\cdot \\vec r_i\\Big\\rangle \\\\ &= n\\,\\langle V\\rangle \\end{aligned}"
    label: "Virialteoremet for et system som holder seg endelig; tidsmidler. Den siste likheten gjelder for et potensial som er homogent av grad $n$, som $V \\propto r^n$. Keplerbaner har $n = -1$ og $E = -\\langle T\\rangle$, oscillatoren $n = 2$ og $\\langle T\\rangle = \\langle V\\rangle$."
  - id: trelegeme-lagrange
    section: Trelegemeproblemet
    tex: "L = \\tfrac12 m\\left(\\dot x^2 + \\dot y^2\\right) \\allowbreak + m\\omega\\left(x\\dot y - y\\dot x\\right) \\allowbreak - m\\,U(x, y)"
    label: "Det lette legemet i det begrensede trelegemeproblemet, i systemet $K'$ som roterer med $\\omega^2 = G(m_1 + m_2)/d^3$ om massesenteret. $m_1$ og $m_2$ står i ro på $x$-aksen, og leddet som er lineært i farten, gir Corioliskraften."
  - id: trelegeme-potensial
    section: Trelegemeproblemet
    tex: "U = -\\frac{Gm_1}{r_1} - \\frac{Gm_2}{r_2} \\allowbreak - \\tfrac12\\omega^2\\left(x^2 + y^2\\right)"
    label: "Potensialet per masse i det roterende systemet, tyngden fra $m_1$ og $m_2$ pluss sentrifugalpotensialet. $r_1$ og $r_2$ er avstandene til de to massene, og Lagrangepunktene er de stasjonære punktene til $U$."
  - id: jacobi-konstant
    section: Trelegemeproblemet
    tex: "C = \\tfrac12\\left(\\dot x^2 + \\dot y^2\\right) + U(x, y)"
    label: "Jacobis konstant, energifunksjonen per masse i det roterende systemet. Den er bevart, og legemet kan bare være der $U \\le C$."
  - id: lagrangepunkter
    section: Trelegemeproblemet
    tex: "r_1 = r_2 = d \\allowbreak\\qquad h \\approx d\\left(\\frac{m_2}{3m_1}\\right)^{1/3}"
    label: "$L_4$ og $L_5$ danner likesidede trekanter med $m_1$ og $m_2$. $L_1$ og $L_2$ ligger i avstanden $h$ på hver side av $m_2$ når $m_2 \\ll m_1$, og $L_3$ ligger på motsatt side av $m_1$."
  - id: lagrange-stabilitet
    section: Trelegemeproblemet
    tex: "27\\,m_1 m_2 < (m_1 + m_2)^2"
    label: "Betingelsen for at $L_4$ og $L_5$ er stabile, $m_1/m_2 > 24{,}96$. $L_1$, $L_2$ og $L_3$ er ustabile for alle masseforhold."

  - id: sma-svingninger
    section: Små svingninger
    tex: "L \\approx \\tfrac12 m(q_0)\\,\\dot\\eta^2 - \\tfrac12 V''(q_0)\\,\\eta^2 \\allowbreak\\qquad \\omega^2 = \\frac{V''(q_0)}{m(q_0)}"
    label: "Små svingninger om en likevekt $q_0$ med én frihetsgrad, for $L = \\tfrac12 m(q)\\dot q^2 - V(q)$ og $q = q_0 + \\eta$. Likevekten er stabil når $V''(q_0) > 0$."
  - id: kvadratisk-lagrange
    section: Små svingninger
    tex: "L \\approx \\tfrac12 T_{ij}\\,\\dot\\eta_i\\dot\\eta_j - \\tfrac12 V_{ij}\\,\\eta_i\\eta_j \\allowbreak\\qquad T_{ij} = m_{ij}(q_0) \\allowbreak\\qquad V_{ij} = \\frac{\\partial^2 V}{\\partial q_i\\,\\partial q_j}\\bigg|_{q_0}"
    label: "Lagrangefunksjonen til andre orden i utslagene $\\eta_i = q_i - q_{0i}$ fra en likevekt, med $T = \\tfrac12 m_{ij}(q)\\dot q_i\\dot q_j$. Begge matrisene er symmetriske, og $\\boldsymbol T$ er positivt definitt."
  - id: sekulaerligning
    section: Små svingninger
    tex: "\\det\\left(\\boldsymbol V - \\omega^2\\boldsymbol T\\right) = 0 \\allowbreak\\qquad \\left(\\boldsymbol V - \\omega_n^2\\boldsymbol T\\right)\\mathbf A_n = 0"
    label: "Sekulærligningen for egenfrekvensene $\\omega_n$, og ligningen for normalmoden $\\mathbf A_n$. $\\omega_n^2 < 0$ gir ustabil likevekt, $\\omega_n^2 = 0$ en fri translasjon eller rotasjon."
  - id: normalkoordinater
    section: Små svingninger
    tex: "\\boldsymbol\\eta = \\sum_n \\xi_n\\,\\mathbf A_n \\allowbreak\\qquad L = \\tfrac12\\sum_n\\left(\\dot\\xi_n^2 - \\omega_n^2\\,\\xi_n^2\\right) \\allowbreak\\qquad \\mathbf A_m^\\top\\boldsymbol T\\mathbf A_n = \\delta_{mn}"
    label: "Normalkoordinatene $\\xi_n$ er uavhengige harmoniske oscillatorer når modene er normert med $\\boldsymbol T$ som vekt. Startverdiene er $\\xi_n(0) = \\mathbf A_n^\\top\\boldsymbol T\\boldsymbol\\eta(0)$."
  - id: kjede-dispersjon
    section: Små svingninger
    tex: "\\omega = 2\\sqrt{\\frac{k}{m}}\\,\\left|\\sin\\frac{\\varphi}{2}\\right| \\allowbreak\\qquad v = a\\sqrt{\\frac{k}{m}}"
    label: "Normalmodene til en kjede av like atomer med masse $m$, avstand $a$ og fjærkonstant $k$. $\\varphi$ er faseforskjellen mellom naboatomer, og $v$ er lydfarten for lange bølger."
  - id: anharmonisk-frekvens
    section: Små svingninger
    tex: "\\omega \\approx \\omega_0 + \\frac{3\\varepsilon A^2}{8\\omega_0}"
    label: "Frekvensen til $\\ddot x + \\omega_0^2 x + \\varepsilon x^3 = 0$ med amplitude $A$, til første orden i $\\varepsilon$. For pendelen er $\\varepsilon = -\\omega_0^2/6$ og $\\omega = \\omega_0(1 - \\theta_0^2/16)$."

  - id: stivt-legeme-hastighet
    section: Stive legemer
    tex: "\\dot{\\vec r}_i = \\dot{\\vec R} + \\vec\\omega \\times \\left(\\vec r_i - \\vec R\\right) \\allowbreak\\qquad \\dot{\\hat e}_a' = \\vec\\omega \\times \\hat e_a'"
    label: "Hastigheten til punkt $i$ i et stivt legeme med massesenteret $\\vec R$. Enhetsvektorene $\\hat e_a'$ sitter fast i legemet, og $\\vec\\omega$ er den samme uansett hvilket punkt i legemet som brukes som origo."
  - id: treghetstensor
    section: Stive legemer
    tex: "I_{ab} = \\sum_i m_i\\left(r_i^2\\,\\delta_{ab} - x_{ia}\\,x_{ib}\\right) \\allowbreak\\qquad I_{ab} = \\int \\rho\\left(r^2\\,\\delta_{ab} - x_a x_b\\right)dV"
    label: "Treghetstensoren om et punkt $O$, med posisjonene målt fra $O$ og komponentene langs aksene i legemet. Diagonalelementene er treghetsmomentene om aksene, for eksempel $I_{11} = \\int\\rho\\,(y^2 + z^2)\\,dV$."
  - id: dreieimpuls-stivt
    section: Stive legemer
    tex: "\\vec L = \\boldsymbol I\\vec\\omega \\allowbreak\\qquad T = \\tfrac12\\,\\vec\\omega \\cdot \\boldsymbol I\\vec\\omega \\allowbreak\\qquad I_{\\hat n} = \\hat n \\cdot \\boldsymbol I\\hat n"
    label: "Dreieimpulsen og den kinetiske energien for rotasjon om et fast punkt, og treghetsmomentet om aksen $\\hat n$. $\\vec L$ er parallell med $\\vec\\omega$ bare når $\\vec\\omega$ ligger langs en hovedakse."
  - id: hovedakser
    section: Stive legemer
    tex: "L_a = I_a\\,\\omega_a \\allowbreak\\qquad T = \\tfrac12\\left(I_1\\omega_1^2 + I_2\\omega_2^2 + I_3\\omega_3^2\\right)"
    label: "Med aksene langs hovedaksene er treghetstensoren diagonal, med hovedtreghetsmomentene $I_1$, $I_2$ og $I_3$. For et flatt legeme er treghetsmomentet om normalen summen av de to i planet."
  - id: parallellakse
    section: Stive legemer
    tex: "I_{ab} = I^{\\text{cm}}_{ab} + M\\left(R^2\\,\\delta_{ab} - R_aR_b\\right) \\allowbreak\\qquad I = I_\\text{cm} + Mh^2"
    label: "<b>Parallellakseteoremet.</b> $\\vec R$ er massesenteret målt fra det nye punktet, og $h$ er avstanden mellom to parallelle akser der den ene går gjennom massesenteret."
  - id: kinetisk-stivt
    section: Stive legemer
    tex: "T = \\tfrac12 M\\dot{\\vec R}^2 + \\tfrac12\\,\\vec\\omega \\cdot \\boldsymbol I^{\\text{cm}}\\vec\\omega"
    label: "Den kinetiske energien til et stivt legeme, massesenteret pluss rotasjonen om massesenteret. Står et punkt $O$ fast, er $T = \\tfrac12\\,\\vec\\omega \\cdot \\boldsymbol I^{O}\\vec\\omega$."
  - id: fysisk-pendel
    section: Stive legemer
    tex: "L = \\tfrac12 I_O\\dot\\theta^2 + MgD\\cos\\theta \\allowbreak\\qquad \\omega^2 = \\frac{MgD}{I_O}"
    label: "Fysisk pendel: et legeme som svinger om en fast, vannrett akse. $I_O$ er treghetsmomentet om aksen, $D$ avstanden fra aksen til massesenteret, og $\\omega$ frekvensen for små svingninger."
  - id: rulling
    section: Stive legemer
    tex: "\\dot{\\vec R} + \\vec\\omega \\times \\left(\\vec r_A - \\vec R\\right) = 0 \\allowbreak\\qquad \\dot s = R\\dot\\theta"
    label: "Rulling uten glidning: kontaktpunktet $A$ står i ro. For et hjul med radius $R$ som ruller langs ei linje, er føringen holonom, $s = R\\theta + \\text{konstant}$, og friksjonen gjør ikke arbeid."
  - id: eulers-ligninger
    section: Eulers ligninger og snurrebassen
    tex: "\\begin{aligned} I_1\\dot\\omega_1 + (I_3 - I_2)\\,\\omega_2\\omega_3 &= N_1 \\\\ I_2\\dot\\omega_2 + (I_1 - I_3)\\,\\omega_3\\omega_1 &= N_2 \\\\ I_3\\dot\\omega_3 + (I_2 - I_1)\\,\\omega_1\\omega_2 &= N_3 \\end{aligned}"
    label: "<b>Eulers ligninger</b>: $\\dot{\\vec L} = \\vec N$ med komponentene langs hovedaksene, om et fast punkt eller om massesenteret. Uten dreiemoment er $T$ og $|\\vec L|$ bevart."
  - id: fri-symmetrisk-snurrebass
    section: Eulers ligninger og snurrebassen
    tex: "\\Omega = \\frac{I_3 - I_1}{I_1}\\,\\omega_3 \\allowbreak\\qquad \\dot{\\hat e}_3' = \\frac{\\vec L}{I_1} \\times \\hat e_3'"
    label: "Fri symmetrisk snurrebass, $I_1 = I_2$. $\\omega_3$ er konstant, og sett fra legemet roterer $\\vec\\omega$ om symmetriaksen med $\\Omega$. Sett fra rommet presesserer symmetriaksen om den faste $\\vec L$ med vinkelfarten $|\\vec L|/I_1$."
  - id: stabil-rotasjon
    section: Eulers ligninger og snurrebassen
    tex: "\\lambda^2 = \\frac{(I_3 - I_1)(I_1 - I_2)}{I_2 I_3}\\,\\omega_1^2"
    label: "Små avvik fra rotasjon om hovedakse 1 går som $e^{\\lambda t}$. Rotasjonen er stabil når $I_1$ er det største eller det minste hovedtreghetsmomentet, og ustabil når det er det midterste."
  - id: rotasjonsmatrise
    section: Eulers ligninger og snurrebassen
    tex: "\\hat e_a' = \\sum_b R_{ab}\\,\\hat e_b \\allowbreak\\qquad \\boldsymbol R\\boldsymbol R^{\\mathsf T} = \\boldsymbol 1 \\allowbreak\\qquad \\det\\boldsymbol R = +1"
    label: "Rotasjonsmatrisen mellom rommets akser $\\hat e_a$ og legemets akser $\\hat e_a'$ er ortogonal med determinant $+1$. Treghetstensoren skifter akser som ${\\boldsymbol I' = \\boldsymbol R\\boldsymbol I\\boldsymbol R^{\\mathsf T}}$."
  - id: eulervinkler-omega
    section: Eulers ligninger og snurrebassen
    tex: "\\begin{aligned} \\omega_1 &= \\dot\\phi\\sin\\theta\\sin\\psi + \\dot\\theta\\cos\\psi \\\\ \\omega_2 &= \\dot\\phi\\sin\\theta\\cos\\psi - \\dot\\theta\\sin\\psi \\\\ \\omega_3 &= \\dot\\psi + \\dot\\phi\\cos\\theta \\end{aligned}"
    label: "Vinkelhastigheten langs legemets akser, uttrykt ved Eulervinklene: $\\phi$ om $\\hat e_3$, $\\theta$ om knutelinja og $\\psi$ om $\\hat e_3'$. Med $I_1 = I_2$ er $\\omega_1^2 + \\omega_2^2 = \\dot\\theta^2 + \\dot\\phi^2\\sin^2\\theta$."
  - id: tung-snurrebass
    section: Eulers ligninger og snurrebassen
    tex: "L = \\tfrac12 I_1\\left(\\dot\\theta^2 + \\dot\\phi^2\\sin^2\\theta\\right) \\allowbreak + \\tfrac12 I_3\\left(\\dot\\psi + \\dot\\phi\\cos\\theta\\right)^2 \\allowbreak - Mgl\\cos\\theta"
    label: "Tung symmetrisk snurrebass med spissen fast. $I_1$ og $I_3$ er treghetsmomentene om spissen, og $l$ er avstanden fra spissen til massesenteret."
  - id: snurrebass-impulser
    section: Eulers ligninger og snurrebassen
    tex: "p_\\psi = I_3\\left(\\dot\\psi + \\dot\\phi\\cos\\theta\\right) \\allowbreak = I_3\\omega_3 \\allowbreak\\qquad p_\\phi = I_1\\dot\\phi\\sin^2\\theta + I_3\\omega_3\\cos\\theta"
    label: "$\\phi$ og $\\psi$ er sykliske for den tunge snurrebassen. $p_\\psi$ er komponenten av $\\vec L$ langs symmetriaksen og $p_\\phi$ komponenten langs loddlinja. Energien er bevart også."
  - id: snurrebass-veff
    section: Eulers ligninger og snurrebassen
    tex: "\\tfrac12 I_1\\dot\\theta^2 + V_\\text{eff}(\\theta) \\allowbreak = E - \\tfrac12 I_3\\omega_3^2 \\allowbreak\\qquad V_\\text{eff}(\\theta) = \\frac{(p_\\phi - p_\\psi\\cos\\theta)^2}{2I_1\\sin^2\\theta} \\allowbreak + Mgl\\cos\\theta"
    label: "Bevegelsen i $\\theta$ for den tunge snurrebassen. $\\theta$ svinger mellom to vendepunkter, og den svingningen er nutasjon."
  - id: jevn-presesjon
    section: Eulers ligninger og snurrebassen
    tex: "Mgl = \\dot\\phi\\,(I_3\\omega_3 - I_1\\dot\\phi\\cos\\theta_0) \\allowbreak\\qquad \\dot\\phi \\approx \\frac{Mgl}{I_3\\omega_3}"
    label: "<b>Jevn presesjon</b> i vinkelen $\\theta_0$. Den langsomme løsningen $\\dot\\phi \\approx Mgl/I_3\\omega_3$ gjelder når snurrebassen spinner fort, og er uavhengig av vinkelen."
  - id: sovende-snurrebass
    section: Eulers ligninger og snurrebassen
    tex: "I_3^2\\omega_3^2 > 4I_1Mgl"
    label: "Betingelsen for at en snurrebass står stabilt rett opp, $\\theta = 0$."

  - id: plan-pendel
    section: Kjente systemer
    tex: "L = \\tfrac12 ml^2\\dot\\theta^2 + mgl\\cos\\theta, \\qquad \\ddot\\theta = -\\frac{g}{l}\\sin\\theta"
    label: "Den plane pendelen med $\\theta$ fra loddlinja. Energien $E = \\tfrac12 ml^2\\dot\\theta^2 - mgl\\cos\\theta$ er bevart; $E < mgl$ gir svingning mellom to vendepunkter, $E > mgl$ rotasjon."
  - id: pendel-paa-vogn
    section: Kjente systemer
    tex: "L = \\tfrac12 (M + m)\\dot x^2 + ml\\dot x\\dot\\theta\\cos\\theta + \\tfrac12 ml^2\\dot\\theta^2 + mgl\\cos\\theta"
    label: "Pendel med masse $m$ under ei fri vogn med masse $M$ på en vannrett skinne. $x$ er syklisk, så den totale vannrette impulsen $p_x = (M + m)\\dot x + ml\\dot\\theta\\cos\\theta$ er bevart, i tillegg til energien."
  - id: magnetfelt-lagrange
    section: Kjente systemer
    tex: "L = \\tfrac12 m\\left(\\dot x^2 + \\dot y^2\\right) + \\tfrac12 qB\\left(x\\dot y - y\\dot x\\right)"
    label: "Ladd partikkel i planet vinkelrett på $\\vec B = B\\hat z$, med $\\vec A = \\tfrac12 B(-y, x, 0)$. Forskyvning i $x$ og $y$ endrer $L$ med en total tidsderivert og gir de bevarte størrelsene $m\\dot x - qBy$ og $m\\dot y + qBx$, som fastlegger sentrum i sirkelbanen. Energien er $\\tfrac12 mv^2$."
  - id: roterende-ring
    section: Kjente systemer
    tex: "L = \\tfrac12 ma^2\\left(\\dot\\theta^2 + \\omega^2\\sin^2\\theta\\right) + mga\\cos\\theta"
    label: "Perle på en ring med radius $a$ som roterer med fast $\\omega$ om den loddrette diameteren, $\\theta$ fra bunnpunktet. Energifunksjonen $H = \\tfrac12 ma^2\\dot\\theta^2 - \\tfrac12 ma^2\\omega^2\\sin^2\\theta - mga\\cos\\theta$ er bevart, energien $T + V$ er det ikke. Bunnpunktet er stabilt for $\\omega^2 < g/a$."
  - id: dobbeltpendel
    section: Kjente systemer
    tex: "\\begin{aligned} L &= \\tfrac12 (m_1 + m_2)\\,l_1^2\\dot\\theta_1^2 + \\tfrac12 m_2 l_2^2\\dot\\theta_2^2 + m_2 l_1 l_2\\dot\\theta_1\\dot\\theta_2\\cos(\\theta_1 - \\theta_2) \\\\ &\\quad + (m_1 + m_2)\\,g l_1\\cos\\theta_1 + m_2 g l_2\\cos\\theta_2 \\end{aligned}"
    label: "Dobbeltpendelen med begge vinklene fra loddlinja. Bare energien er bevart. For små utslag med $m_1 = m_2$ og $l_1 = l_2 = l$ er normalfrekvensene gitt ved $\\omega^2 = (2 \\pm \\sqrt 2)\\,g/l$."
  - id: kapitza
    section: Kjente systemer
    tex: "\\begin{aligned} L &= \\tfrac12 ml^2\\dot\\theta^2 + ml(g + \\ddot y_\\text{p})\\cos\\theta \\\\ V_\\text{eff}(\\Theta) &= -mgl\\cos\\Theta + \\tfrac14 mA^2\\Omega^2\\sin^2\\Theta \\end{aligned}"
    label: "Pendel med oppheng som svinger loddrett, $y_\\text{p} = A\\cos\\Omega t$. $L$ avhenger eksplisitt av tida, og ingenting er bevart. Midlet over den raske svingningen beveger den langsomme vinkelen $\\Theta$ seg i $V_\\text{eff}$, som har et minimum i toppunktet når $A^2\\Omega^2 > 2gl$."

# ── Symboler ─────────────────────────────────────────────────────────────────
# Symbolene slik modulene bruker dem, med én rad per betydning der en bokstav
# betyr flere ting, og en merknad der den kan forveksles med en annen.
symbols:
  # ── Newtonsk mekanikk ──
  - { tex: "K,\\ K'", meaning: "Referansesystemer; en størrelse målt i $K'$ får merke, som $\\vec v\\,'$", section: "Newtonsk mekanikk", term: "Inertialsystem", formula: galilei, note: "I Galilei-transformasjonen er begge inertiale, $\\vec v$ er farten til $K'$ og partikkelens hastighet heter $\\vec u$. I roterende systemer er $K'$ det roterende." }
  - { tex: "m,\\ m_i", meaning: "Masse, $m_i$ for partikkel $i$", unit: "kg", section: "Newtonsk mekanikk", note: "Med Lagrange-multiplikatorer er $m$ også antallet føringer $f_\\alpha$." }
  - { tex: "M", meaning: "Total masse, $\\sum_i m_i$", unit: "kg", section: "Newtonsk mekanikk", formula: massesenter, note: "For to legemer er $M = m_1 + m_2$, med $m_1 \\ge m_2$ i trelegemeproblemet. Ellers er $M$ en navngitt tung masse: vogna i pendel på vogn og midtatomet i molekylet med tre atomer." }
  - { tex: "T", meaning: "Kinetisk energi", unit: "J", section: "Newtonsk mekanikk", formula: kinetisk-splitt, note: "I Keplers tredje lov er $T$ omløpstida, og $T_\\text{F}$ er tida svingeplanet til Foucaults pendel bruker på en runde." }
  - { tex: "V", meaning: "Potensialet, den potensielle energien", unit: "J", section: "Newtonsk mekanikk", term: "Potensial", formula: konservativ }
  - { tex: "E", meaning: "Energien, $T + V$", unit: "J", section: "Newtonsk mekanikk", formula: energi-1d, note: "Ikke det elektriske feltet $\\vec E$ hos den ladde partikkelen." }
  - { tex: "x_0,\\ q_0", meaning: "Likevektspunkt, der $V' = 0$", section: "Newtonsk mekanikk", term: "Likevektspunkt", formula: likevekt }
  - { tex: "\\omega", meaning: "Vinkelfrekvensen til en svingning", unit: "rad/s", section: "Newtonsk mekanikk", formula: likevekt, id: omega, note: "Om et minimum er $\\omega = \\sqrt{V''(x_0)/m}$. $\\omega_0$ er frekvensen uten forstyrrelse, som $\\sqrt{g/l}$ for Foucaults pendel. Verken $\\Omega$ eller vinkelfarten $\\vec\\omega$ til et roterende system." }
  - { tex: "\\Omega", meaning: "Vinkelfrekvens som settes utenfra", unit: "rad/s", section: "Newtonsk mekanikk", id: omega-stor, note: "Frekvensvariabelen i Greens funksjon, drivfrekvensen til Kapitzas pendel og ringens vinkelfart i modulen om små svingninger. Ikke $\\omega$, frekvensen systemet selv svinger med. I $d\\sigma/d\\Omega$ er $\\Omega$ en romvinkel, og $\\Omega_\\text{F}$ er dreiefarten til svingeplanet i Foucaults pendel." }
  - { tex: "k", meaning: "Fjærkonstant, koeffisienten i $\\tfrac12 kx^2$", unit: "N/m", section: "Newtonsk mekanikk", formula: kjede-dispersjon, note: "Samme bokstav som styrken i $V = -k/r$ og antallet føringer i $n = 3N - k$." }
  - { tex: "\\mu", meaning: "Redusert masse, $m_1m_2/(m_1 + m_2)$", unit: "kg", section: "Newtonsk mekanikk", term: "Redusert masse", formula: redusert-masse, id: mu }
  - { tex: "\\vec R", meaning: "Massesenteret, $\\sum_i m_i\\vec r_i/M$", unit: "m", section: "Newtonsk mekanikk", term: "Massesenter", formula: massesenter, note: "I roterende systemer er $\\vec R$ posisjonen målt fra jordas sentrum. $R$ alene er en radius: jordas, kulas, ringens eller hjulets." }
  - { tex: "\\vec y_i", meaning: "Posisjonen til partikkel $i$ målt fra massesenteret, $\\vec r_i - \\vec R$", unit: "m", section: "Newtonsk mekanikk", formula: kinetisk-splitt, note: "$\\sum_i m_i\\vec y_i = 0$." }
  - { tex: "\\vec L", meaning: "Dreieimpuls, $\\sum_i \\vec r_i \\times \\vec p_i$", unit: "kg·m²/s", section: "Newtonsk mekanikk", formula: dreieimpuls-ytre, note: "Ikke Lagrangefunksjonen $L$. I tolegemeproblemet heter lengden $J$." }
  - { tex: "\\vec N", meaning: "Dreiemomentet, $\\sum_i \\vec r_i \\times \\vec F_i$", unit: "N·m", section: "Newtonsk mekanikk", formula: dreieimpuls-ytre, note: "$\\vec N^{(e)}$ er dreiemomentet fra de ytre kreftene." }
  - { tex: "G_R(\\tau)", meaning: "Retardert Greens funksjon, responsen på et enhetsdytt", unit: "s/kg", section: "Newtonsk mekanikk", term: "Retardert Greens funksjon", formula: green-oscillator, note: "$\\tau = t - t'$ er tida siden dyttet, og $\\theta(\\tau)$ er trinnfunksjonen, ikke en vinkel." }
  - { tex: "J(t)", meaning: "Den ytre kraften som driver oscillatoren", unit: "N", section: "Newtonsk mekanikk", formula: green-respons, note: "Ikke dreieimpulsen $J$ i tolegemeproblemet." }
  # ── Lagrangeformalismen ──
  - { tex: "q_i,\\ \\dot q_i", meaning: "Generaliserte koordinater og hastigheter", section: "Lagrangeformalismen", term: "Generaliserte koordinater", formula: euler-lagrange, id: q, note: "Ikke ladningen $q$ i Lagrangefunksjonen for en ladd partikkel." }
  - { tex: "n", meaning: "Antall frihetsgrader, $3N - k$", section: "Lagrangeformalismen", term: "Frihetsgrader", formula: frihetsgrader, note: "$N$ partikler med $k$ holonome føringer; her er $k$ et antall og ikke en fjærkonstant. I modulen om små svingninger heter antallet frihetsgrader $N$, og $n$ nummererer modene. I virialteoremet er $n$ graden til potensialet." }
  - { tex: "L", meaning: "Lagrangefunksjonen, $T - V$", unit: "J", section: "Lagrangeformalismen", term: "Lagrangefunksjon", formula: lagrangefunksjon, id: lagrangefunksjon, note: "Ikke dreieimpulsen $\\vec L$ eller Lagrangepunktene $L_1$ til $L_5$." }
  - { tex: "S", meaning: "Virkningen, $\\int L\\,dt$ langs en bane", unit: "J·s", section: "Lagrangeformalismen", term: "Virkning", formula: virkning, note: "Med Lagrange-multiplikatorer er $S$ snorkraften i pendelen, $S = -\\lambda$." }
  - { tex: "f(q, t)", meaning: "Føringen, skrevet $f(q, t) = 0$; med flere føringer $f_\\alpha$", section: "Lagrangeformalismen", term: "Holonom føring", formula: lagrange-multiplikator, note: "I $L' = L + df/dt$ er $f$ en vilkårlig funksjon av koordinatene og tida, ikke en føring." }
  - { tex: "\\lambda", meaning: "Lagrange-multiplikatoren; $\\lambda\\,\\partial f/\\partial q_k$ er føringskraften", section: "Lagrangeformalismen", term: "Lagrange-multiplikator", formula: lagrange-multiplikator, id: lambda, note: "Har dimensjon kraft når $f$ er en lengde. Ikke vekstraten $\\lambda$ i $e^{\\lambda t}$ nær en ustabil likevekt." }
  - { tex: "p_i", meaning: "Generalisert impuls, $\\partial L/\\partial\\dot q_i$", section: "Lagrangeformalismen", term: "Generalisert impuls", formula: generalisert-impuls, id: p-i, note: "Bevart når $q_i$ er syklisk. For en ladd partikkel er $\\vec p = m\\dot{\\vec r} + q\\vec A$ og ikke bare $m\\dot{\\vec r}$." }
  - { tex: "H", meaning: "Energifunksjonen, $\\sum_i \\dot q_i p_i - L$", unit: "J", section: "Lagrangeformalismen", term: "Energifunksjon", formula: energifunksjon, id: h, note: "Lik $T + V$ bare når føringene er tidsuavhengige og $V$ ikke avhenger av hastighetene." }
  - { tex: "\\epsilon,\\ F_i", meaning: "Parameteren og retningen i symmetrien $q_i \\to q_i + \\epsilon F_i$", section: "Lagrangeformalismen", term: "Kontinuerlig symmetri", formula: noether, note: "$F_i$ er ikke en kraft. Ikke $\\varepsilon$ i den anharmoniske oscillatoren." }
  - { tex: "F,\\ Q", meaning: "Funksjonen i $\\delta L = \\epsilon\\,dF/dt$ og den bevarte størrelsen $Q = \\sum_i p_iF_i - F$", section: "Lagrangeformalismen", term: "Noethers teorem", formula: noether, note: "Ikke en kraft $\\vec F$, og ikke kjerneladningen $Q$ i Rutherford-spredning." }
  - { tex: "\\phi,\\ \\vec A", meaning: "Skalarpotensialet og vektorpotensialet for en ladd partikkel", unit: "V, T·m", section: "Lagrangeformalismen", term: "Gaugeinvarians", formula: lagrange-ladd-partikkel, note: "$\\vec E = -\\nabla\\phi - \\partial\\vec A/\\partial t$ og $\\vec B = \\nabla \\times \\vec A$. Ikke vinkelen $\\phi$ eller Runge–Lenz-vektoren $\\vec A$." }
  # ── Roterende referansesystemer ──
  - { tex: "\\vec\\omega", meaning: "Vinkelhastigheten til et roterende system eller et stivt legeme", unit: "s⁻¹", section: "Roterende referansesystemer", term: "Vinkelhastighet", formula: rotasjon-tidsderivert, note: "For jorda er $\\omega = 7{,}29 \\cdot 10^{-5}$ s⁻¹. Perla på roterende ring i «Kjente systemer» bruker $\\omega$ for ringens vinkelfart, som modulen om små svingninger kaller $\\Omega$." }
  - { tex: "\\vec v\\,',\\ \\vec a\\,'", meaning: "Hastighet og akselerasjon målt i det roterende systemet $K'$", unit: "m/s, m/s²", section: "Roterende referansesystemer", formula: akselerasjon-roterende }
  - { tex: "\\vec d", meaning: "Komponenten av $\\vec r$ vinkelrett på rotasjonsaksen", unit: "m", section: "Roterende referansesystemer", formula: sentrifugalkraft, note: "Ellers er $d$ avbøyningen i fall fra et tårn og avstanden mellom $m_1$ og $m_2$ i trelegemeproblemet." }
  - { tex: "V_\\text{s}", meaning: "Sentrifugalpotensialet, $-\\tfrac12 m\\omega^2 d^2$", unit: "J", section: "Roterende referansesystemer", term: "Sentrifugalkraft", formula: sentrifugalkraft, note: "Inngår i $U$ i trelegemeproblemet og i $H$ for et roterende system." }
  - { tex: "\\vec F_\\text{s},\\ \\vec F_\\text{C}", meaning: "Sentrifugalkraften og Corioliskraften", unit: "N", section: "Roterende referansesystemer", term: "Corioliskraft", formula: corioliskraft }
  # ── To- og trelegemeproblemet ──
  - { tex: "J", meaning: "Dreieimpulsen, $p_\\phi = \\mu r^2\\dot\\phi$", unit: "kg·m²/s", section: "To- og trelegemeproblemet", formula: sentralkraft-lagrange, id: j, note: "$J = |\\vec L|$. «Kjente systemer» skriver $p_\\phi$ for den samme størrelsen. Ikke kraften $J(t)$ i Greens funksjon." }
  - { tex: "V_\\text{eff}", meaning: "Det effektive potensialet, $V + J^2/2\\mu r^2$", unit: "J", section: "To- og trelegemeproblemet", term: "Effektivt potensial", formula: effektivt-potensial, id: veff, note: "Den sfæriske pendelen har sin egen $V_\\text{eff}(\\theta)$ og Kapitzas pendel en midlet $V_\\text{eff}(\\Theta)$." }
  - { tex: "k", meaning: "Styrken i $V = -k/r$, $Gm_1m_2$ for gravitasjon", unit: "J·m", section: "To- og trelegemeproblemet", formula: kepler-bane, id: k, note: "Negativ for frastøting, $k = -qQ/4\\pi\\epsilon_0$. Ikke fjærkonstanten $k$." }
  - { tex: "e", meaning: "Eksentrisiteten", section: "To- og trelegemeproblemet", term: "Eksentrisitet", formula: kepler-bane, id: e, note: "$e = 0$ er en sirkel, $0 < e < 1$ en ellipse, $e = 1$ en parabel og $e > 1$ en hyperbel. Ikke Eulers tall $e$." }
  - { tex: "r_0", meaning: "Radien til sirkelbanen med samme $J$, $J^2/\\mu k$", unit: "m", section: "To- og trelegemeproblemet", formula: kepler-bane, note: "I molekylet med tre atomer er $r_0$ likevektsavstanden i hver binding." }
  - { tex: "a,\\ b", meaning: "Den store og den lille halvaksen til ellipsen", unit: "m", section: "To- og trelegemeproblemet", formula: ellipse-akser, note: "$r_\\text{min}, r_\\text{max} = a(1 \\mp e)$. $a$ er også radien til ringen i «Kjente systemer», radien til den harde kula i spredning, avstanden mellom atomene i kjeden og sidene til plata og kuben blant de stive legemene." }
  - { tex: "u", meaning: "$1/r$, variabelen i baneligningen", unit: "m⁻¹", section: "To- og trelegemeproblemet", formula: baneligning }
  - { tex: "\\vec A", meaning: "Runge–Lenz-vektoren, bevart for $V = -k/r$", section: "To- og trelegemeproblemet", formula: runge-lenz, note: "Peker mot perihel og har lengden $\\mu ke$. Ikke vektorpotensialet $\\vec A$." }
  - { tex: "G", meaning: "Gravitasjonskonstanten", unit: "N·m²/kg²", section: "To- og trelegemeproblemet", formula: keplers-tredje, note: "$6{,}674 \\cdot 10^{-11}$ N·m²/kg². For jorda er $GM_\\oplus = 3{,}986 \\cdot 10^5$ km³/s²." }
  - { tex: "s", meaning: "Støtparameteren", unit: "m", section: "To- og trelegemeproblemet", term: "Støtparameter", formula: rutherford, note: "For et legeme som ruller, er $s$ strekningen langs underlaget, med $\\dot s = R\\dot\\theta$." }
  - { tex: "\\Theta", meaning: "Spredningsvinkelen", unit: "rad", section: "To- og trelegemeproblemet", formula: rutherford, note: "Hos Kapitzas pendel er $\\Theta$ den langsomme delen av vinkelen $\\theta$." }
  - { tex: "d\\sigma/d\\Omega", meaning: "Det differensielle spredningstverrsnittet", unit: "m²", section: "To- og trelegemeproblemet", term: "Spredningstverrsnitt", formula: spredningstverrsnitt, note: "$d\\Omega$ er et romvinkelelement, ikke en frekvens." }
  - { tex: "\\alpha", meaning: "Masseforholdet $m_2/M$ i trelegemeproblemet", section: "To- og trelegemeproblemet", note: "Ellers en lokal konstant: faktoren i $L' = \\alpha L$, indeksen på føringene $f_\\alpha$, vinkelen loddlinja avviker med og vinkelen til skråplanet i eksamensoppgaven om ringen." }
  - { tex: "U", meaning: "Potensialet per masse i det roterende systemet, med sentrifugalleddet", unit: "J/kg", section: "To- og trelegemeproblemet", formula: trelegeme-potensial, note: "De annenderiverte $U_{xx}$, $U_{xy}$ og $U_{yy}$ avgjør stabiliteten til Lagrangepunktene." }
  - { tex: "C", meaning: "Jacobis konstant, $\\tfrac12 v'^2 + U$", unit: "J/kg", section: "To- og trelegemeproblemet", term: "Jacobis konstant", formula: jacobi-konstant, id: jacobi, note: "Legemet kan bare være der $U \\le C$." }
  - { tex: "L_1\\text{–}L_5", meaning: "Lagrangepunktene, likevektspunktene i det roterende systemet", section: "To- og trelegemeproblemet", term: "Lagrangepunkt", formula: lagrangepunkter, note: "Ikke Lagrangefunksjonen $L$. $L_4$ og $L_5$ er stabile når $m_1/m_2 > 24{,}96$." }
  # ── Små svingninger ──
  - { tex: "\\eta,\\ \\eta_i", meaning: "Utslaget fra likevekten, $q_i - q_{0i}$", section: "Små svingninger", formula: kvadratisk-lagrange, note: "I utledningen av Lagranges ligninger er $\\eta(t)$ variasjonen av banen." }
  - { tex: "\\boldsymbol T,\\ \\boldsymbol V", meaning: "Matrisene til den kinetiske og den potensielle energien nær likevekten", section: "Små svingninger", formula: kvadratisk-lagrange, note: "$T_{ij} = m_{ij}(q_0)$ og $V_{ij} = \\partial^2 V/\\partial q_i\\,\\partial q_j$ i likevekten. Fete bokstaver, ikke energiene $T$ og $V$ selv." }
  - { tex: "\\omega_n", meaning: "Egenfrekvensene, røttene av sekulærligningen", unit: "rad/s", section: "Små svingninger", term: "Egenfrekvens", formula: sekulaerligning }
  - { tex: "\\mathbf A_n", meaning: "Modevektoren, forholdet mellom utslagene i mode $n$", section: "Små svingninger", term: "Normalmode", formula: sekulaerligning }
  - { tex: "\\xi_n", meaning: "Normalkoordinaten, utslaget langs mode $n$", section: "Små svingninger", term: "Normalkoordinat", formula: normalkoordinater, note: "Ellers er $\\xi$ et lite utslag, som den raske delen av vinkelen hos Kapitzas pendel, eller $x + iy$ for Foucaults pendel." }
  - { tex: "\\lambda", meaning: "Eksponenten i $e^{\\lambda t}$ for utslaget nær en likevekt", unit: "s⁻¹", section: "Små svingninger", note: "Stabilt når alle røttene $\\lambda^2$ er negative. Ikke Lagrange-multiplikatoren $\\lambda$. I kjeden er $\\lambda$ bølgelengden, og i $V = \\tfrac12 kx^2 + \\tfrac14\\lambda x^4$ en koeffisient." }
  - { tex: "\\varphi", meaning: "Faseforskjellen mellom naboatomer i kjeden, $2\\pi n/N$", unit: "rad", section: "Små svingninger", term: "Dispersjonsrelasjon", formula: kjede-dispersjon }
  # ── Stive legemer ──
  - { tex: "\\hat e_a'", meaning: "Enhetsvektorene langs aksene som sitter fast i legemet", section: "Stive legemer", formula: stivt-legeme-hastighet, note: "$a = 1, 2, 3$ nummererer aksene og $i$ partiklene. Komponentene av $\\vec\\omega$, $\\vec L$ og $\\boldsymbol I$ tas langs disse aksene." }
  - { tex: "\\boldsymbol I,\\ I_{ab}", meaning: "Treghetstensoren om et punkt i legemet", unit: "kg·m²", section: "Stive legemer", term: "Treghetstensor", formula: treghetstensor, note: "Avhenger av punktet. $\\boldsymbol I^{\\text{cm}}$ er tensoren om massesenteret og $\\boldsymbol I^{O}$ om et fast punkt $O$." }
  - { tex: "I_1,\\ I_2,\\ I_3", meaning: "Hovedtreghetsmomentene, egenverdiene til $\\boldsymbol I$", unit: "kg·m²", section: "Stive legemer", term: "Hovedtreghetsmoment", formula: hovedakser }
  - { tex: "I_{\\hat n},\\ I", meaning: "Treghetsmomentet om en akse, $\\sum_i m_i d_i^2$", unit: "kg·m²", section: "Stive legemer", term: "Treghetsmoment", formula: dreieimpuls-stivt, note: "$I_\\text{cm}$ er treghetsmomentet om en akse gjennom massesenteret og $I_O$ om en fast akse gjennom $O$." }
  - { tex: "D", meaning: "Avstanden fra aksen til massesenteret for en fysisk pendel", unit: "m", section: "Stive legemer", term: "Fysisk pendel", formula: fysisk-pendel }
  # ── Eulers ligninger og snurrebassen ──
  - { tex: "\\hat e_a,\\ \\hat e_N", meaning: "Rommets akser i $K$, og knutelinja", section: "Eulers ligninger og snurrebassen", term: "Knutelinje", formula: rotasjonsmatrise, note: "Legemets akser er $\\hat e_a'$. For en tung snurrebass peker $\\hat e_3$ loddrett opp." }
  - { tex: "\\boldsymbol R", meaning: "Rotasjonsmatrisen, $R_{ab} = \\hat e_a' \\cdot \\hat e_b$", section: "Eulers ligninger og snurrebassen", term: "Rotasjonsmatrise", formula: rotasjonsmatrise, note: "Ikke massesenteret $\\vec R$ eller en radius $R$." }
  - { tex: "\\phi,\\ \\theta,\\ \\psi", meaning: "Eulervinklene, dreiningene om $\\hat e_3$, om knutelinja og om $\\hat e_3'$", unit: "rad", section: "Eulers ligninger og snurrebassen", term: "Eulervinkler", formula: eulervinkler-omega, note: "For en tung snurrebass er $\\theta$ vinkelen mellom loddlinja og symmetriaksen, $\\phi$ presesjonsvinkelen og $\\psi$ dreiningen om symmetriaksen. Eksamensoppgavene skriver $\\varphi$." }
  - { tex: "\\omega_3", meaning: "Spinnet, komponenten av $\\vec\\omega$ langs symmetriaksen", unit: "rad/s", section: "Eulers ligninger og snurrebassen", formula: snurrebass-impulser, note: "$\\omega_3 = \\dot\\psi + \\dot\\phi\\cos\\theta$ er konstant for både den frie og den tunge symmetriske snurrebassen." }
  - { tex: "\\Omega", meaning: "Vinkelfrekvensen $\\vec\\omega$ roterer med om symmetriaksen sett fra en fri symmetrisk snurrebass, $(I_3 - I_1)\\,\\omega_3/I_1$", unit: "rad/s", section: "Eulers ligninger og snurrebassen", term: "Symmetrisk snurrebass", formula: fri-symmetrisk-snurrebass, note: "For jorda er $\\Omega \\approx \\omega_3/300$. Sett fra rommet presesserer symmetriaksen med en annen vinkelfart, $|\\vec L|/I_1$." }
  - { tex: "p_\\phi,\\ p_\\psi", meaning: "De bevarte impulsene til den tunge snurrebassen, komponentene av $\\vec L$ langs loddlinja og langs symmetriaksen", unit: "kg·m²/s", section: "Eulers ligninger og snurrebassen", formula: snurrebass-impulser }
  - { tex: "l", meaning: "Avstanden fra spissen til massesenteret for en tung snurrebass", unit: "m", section: "Eulers ligninger og snurrebassen", formula: tung-snurrebass, note: "Eksamensoppgaven kaller den $h$. For den fysiske pendelen heter den samme avstanden $D$." }
  - { tex: "\\varepsilon", meaning: "Styrken til $x^3$-leddet i den anharmoniske oscillatoren", unit: "m⁻²·s⁻²", section: "Små svingninger", formula: anharmonisk-frekvens, note: "Ikke $\\epsilon$ i Noethers teorem. I Greens funksjon er $i\\varepsilon$ forskyvningen av polene." }
  # ── Kjente systemer ──
  - { tex: "l", meaning: "Lengden til pendelen; $l_1$ og $l_2$ for dobbeltpendelen", unit: "m", section: "Kjente systemer", formula: plan-pendel, note: "I eksamensoppgavene står $\\ell$ både for en stanglengde og for dreieimpulsen." }
  - { tex: "\\theta", meaning: "Vinkelen fra loddlinja nedover for en pendel, og fra bunnpunktet for perla på ringen", unit: "rad", section: "Kjente systemer", formula: plan-pendel, note: "$\\theta = \\pi$ er opp ned. For et legeme som ruller, er $\\theta$ dreievinkelen. I Greens funksjon er $\\theta(\\tau)$ trinnfunksjonen." }
  - { tex: "\\phi", meaning: "Vinkelen rundt loddlinja for den sfæriske pendelen, og vinkelen i baneplanet i tolegemeproblemet", unit: "rad", section: "Kjente systemer", formula: sfaerisk-pendel, note: "I roterende systemer er $\\phi$ breddegraden, og for den ladde partikkelen skalarpotensialet." }
  - { tex: "g", meaning: "Tyngdeakselerasjonen", unit: "m/s²", section: "Kjente systemer", note: "$9{,}81$ m/s²." }
  - { tex: "y_\\text{p},\\ A", meaning: "Høyden til opphenget på Kapitzas pendel og amplituden, $y_\\text{p} = A\\cos\\Omega t$", unit: "m", section: "Kjente systemer", formula: kapitza, note: "Pendelen står stabilt opp ned når $A^2\\Omega^2 > 2gl$." }

# ── Begreper ─────────────────────────────────────────────────────────────────
glossary:
  - term: Inertialsystem
    section: Inertialsystemer
    definition: "Referansesystem der en fri partikkel går med konstant hastighet. Newtons andre lov er formulert i slike systemer."
  - term: Galilei-transformasjon
    section: Inertialsystemer
    definition: "Transformasjonen $t' = t$, $\\vec r\\,' = \\vec r - \\vec v t$ mellom koordinatene i to inertialsystemer når tida regnes som absolutt."
  - term: Konservativ kraft
    section: Krefter og potensial
    definition: "Kraftfelt der arbeidet mellom to punkter er det samme for alle baner. Et slikt felt kan skrives som $\\vec F = -\\nabla V$."
  - term: Eksakt differensial
    section: Krefter og potensial
    definition: "En differensialform $F_x\\,dx + F_y\\,dy + F_z\\,dz$ som er differensialet til en funksjon. Linjeintegralet av en eksakt form avhenger bare av endepunktene."
  - term: Potensial
    section: Krefter og potensial
    definition: "Funksjonen $V(\\vec r)$ som en konservativ kraft er den negative gradienten av, $\\vec F = -\\nabla V$."
  - term: Enkeltsammenhengende område
    section: Krefter og potensial
    definition: "Område der enhver lukket kurve kan trekkes sammen til et punkt uten å forlate området. Der er $\\nabla \\times \\vec F = 0$ nok til at kraften er konservativ."
  - term: Likevektspunkt
    section: Bevegelse i et potensial
    definition: "Punkt $x_0$ der $V'(x_0) = 0$, slik at kraften på partikkelen er null. Likevekten er stabil når $V''(x_0) > 0$ og ustabil når $V''(x_0) < 0$."
  - term: Vendepunkt
    section: Bevegelse i et potensial
    definition: "Punkt der partikkelen har null fart fordi $V(x) = E$. Vendepunktene avgrenser området den kan bevege seg i."
  - term: Superposisjonsprinsippet
    section: Greens funksjon
    definition: "For en lineær ligning er summen av to løsninger en ny løsning, så responsen på en sum av krefter er summen av responsene."
  - term: Greens funksjon
    section: Greens funksjon
    definition: "Responsen på et deltadytt: løsningen av $D(t)\\,G(t - t') = \\delta(t - t')$. Den inverterer differensialoperatoren, og superposisjon gir responsen på en vilkårlig kraft."
  - term: Retardert Greens funksjon
    section: Greens funksjon
    definition: "Greens funksjonen som er null for $\\tau < 0$, slik at responsen kommer etter dyttet. Valget svarer til å skyve polene under den reelle aksen."
  - term: Massesenter
    section: Partikkelsystemer
    definition: "Punktet $\\vec R = \\frac{1}{M}\\sum_i m_i \\vec r_i$. Det beveger seg som én partikkel med hele massen $M$, påvirket av summen av de ytre kreftene."
  - term: Sentrale krefter
    section: Partikkelsystemer
    definition: "Indre krefter som virker langs forbindelseslinja mellom partiklene. Kalles også den sterke loven om aksjon og reaksjon; den gjør at dreieimpulsen bare endres av ytre dreiemoment."
  - term: Redusert masse
    section: Partikkelsystemer
    definition: "Massen $\\mu = m_1 m_2/(m_1 + m_2)$ som relativbevegelsen i tolegemeproblemet følger, $\\mu\\ddot{\\vec r} = \\vec F_{12}$."
  - term: Elastisk støt
    section: Støt
    definition: "Støt der både impulsen og den kinetiske energien er bevart. Det er utfallet når kraften mellom partiklene er konservativ."
  - term: Kraftstøt
    section: Støt
    definition: "Tidsintegralet av kraften over støtet, $\\vec I = \\int \\vec F\\,dt$. Det er lik endringen i impuls."
  - term: Holonom føring
    section: Lagrangeformalismen
    definition: "Betingelse på koordinatene på formen $f(\\vec r_1, \\dots, \\vec r_N, t) = 0$, som snorlengden til en pendel. Hver slik føring fjerner én frihetsgrad. Tidsavhengige føringer kalles rheonome, tidsuavhengige skleronome."
  - term: Ikke-holonom føring
    section: Lagrangeformalismen
    definition: "Føring som ikke kan skrives som $f(\\vec r_1, \\dots, \\vec r_N, t) = 0$: en ulikhet, som en partikkel oppå en fast kule, eller en betingelse på hastighetene som ikke kan integreres, som rulling uten å gli. Den fjerner ingen koordinat."
  - term: Frihetsgrader
    section: Lagrangeformalismen
    definition: "Antall uavhengige størrelser som trengs for å angi systemets konfigurasjon. $N$ partikler med $k$ holonome føringer har $3N - k$."
  - term: Generaliserte koordinater
    section: Lagrangeformalismen
    definition: "Uavhengige koordinater $q_1, \\dots, q_n$ som fastlegger konfigurasjonen med føringene bygget inn, som vinkelen $\\theta$ for pendelen."
  - term: Konfigurasjonsrom
    section: Lagrangeformalismen
    definition: "Rommet med de generaliserte koordinatene som akser. Hele systemets bevegelse er én kurve der."
  - term: Føringskraft
    section: Lagrangeformalismen
    definition: "Kraften som holder en føring oppfylt, som snordrag og normalkrefter. Den står vinkelrett på forskyvningene føringen tillater og forsvinner når føringene settes inn i Lagrangefunksjonen. En Lagrange-multiplikator henter den tilbake."
  - term: Lagrangefunksjon
    section: Lagrangeformalismen
    definition: "Funksjonen $L = T - V$ av koordinater og hastigheter. Den bestemmer dynamikken gjennom Lagranges ligninger."
  - term: Virkning
    section: Lagrangeformalismen
    definition: "Tallet $S = \\int L\\, dt$ tilordnet en bane mellom faste endepunkter ved faste tider. Den virkelige banen gjør virkningen stasjonær."
  - term: Gaugetransformasjon
    section: Lagrangeformalismen
    definition: "Byttet $\\vec A \\to \\vec A + \\nabla\\chi$, $\\phi \\to \\phi - \\partial\\chi/\\partial t$ med en vilkårlig funksjon $\\chi(\\vec r, t)$. Feltene $\\vec E$ og $\\vec B$ er uendret, og Lagrangefunksjonen endres med den totale tidsderiverte $q\\,d\\chi/dt$."
  - term: Gaugeinvarians
    section: Lagrangeformalismen
    definition: "At ingen målbar størrelse avhenger av hvilke potensialer $\\phi$ og $\\vec A$ som beskriver feltene. Bevegelsen til en ladd partikkel er gaugeinvariant fordi en gaugetransformasjon bare legger en total tidsderivert til $L$."
  - term: Lagrange-multiplikator
    section: Lagrangeformalismen
    definition: "Ukjent funksjon $\\lambda(t)$ som ganges med føringen $f(q, t)$ og legges til $L$. Ligningen for $\\lambda$ gir føringen tilbake, og $\\lambda\\,\\partial f/\\partial q_k$ er føringskraften i retning $q_k$. Der ei snor eller et underlag har $\\lambda = 0$, slipper føringen."

  - term: Vinkelhastighet
    section: Roterende referansesystemer
    definition: "Vektoren $\\vec\\omega$ som beskriver en rotasjon: retningen ligger langs aksen etter høyrehåndsregelen, og lengden er vinkelfarten. Et punkt som følger rotasjonen har hastigheten $\\vec\\omega \\times \\vec r$."
  - term: Fiktiv kraft
    section: Roterende referansesystemer
    definition: "Et av leddene som må regnes som kraft for at $m\\vec a\\,' = \\text{kraft}$ skal gjelde i et system som ikke er inertialt. Fiktive krefter skyldes ikke noe annet legeme, har ingen motkraft og er proporsjonale med massen."
  - term: Sentrifugalkraft
    section: Roterende referansesystemer
    definition: "Den fiktive kraften $-m\\vec\\omega \\times (\\vec\\omega \\times \\vec r) = m\\omega^2\\vec d$ i et roterende system. Den peker ut fra aksen, virker også på det som ligger i ro, og er konservativ med potensialet $-\\tfrac12 m\\omega^2 d^2$."
  - term: Corioliskraft
    section: Roterende referansesystemer
    definition: "Den fiktive kraften $-2m\\vec\\omega \\times \\vec v\\,'$ på et legeme som beveger seg i et roterende system. Den står vinkelrett på hastigheten, gjør ikke arbeid og dytter mot høyre på den nordlige halvkula."
  - term: Eulerkraft
    section: Roterende referansesystemer
    definition: "Den fiktive kraften $-m\\dot{\\vec\\omega} \\times \\vec r$ som kommer når vinkelfarten til systemet endrer seg. For jorda er den null."
  - term: Effektiv tyngdeakselerasjon
    section: Roterende referansesystemer
    definition: "$\\vec g_\\text{eff} = \\vec g - \\vec\\omega \\times (\\vec\\omega \\times \\vec R)$, tyngden og sentrifugalkraften per masse for et legeme i ro på den roterende jorda. Loddlinja følger $\\vec g_\\text{eff}$, og jordoverflaten står vinkelrett på den."

  - term: Generalisert impuls
    section: Symmetrier og bevarte størrelser
    definition: "$p_i = \\partial L/\\partial\\dot q_i$, impulsen som hører til koordinaten $q_i$. Kalles også kanonisk eller konjugert impuls. Lagranges ligning for $q_i$ lyder $\\dot p_i = \\partial L/\\partial q_i$. Den er lik den mekaniske impulsen bare når hastigheten inngår i $L$ gjennom $T$ alene."
  - term: Syklisk koordinat
    section: Symmetrier og bevarte størrelser
    definition: "Koordinat som ikke inngår i $L$, slik at $\\partial L/\\partial q_i = 0$. Lagranges ligning for den sier at den generaliserte impulsen $p_i$ er bevart."
  - term: Energifunksjon
    section: Symmetrier og bevarte størrelser
    definition: "$H = \\sum_i \\dot q_i\\,\\partial L/\\partial\\dot q_i - L$, med $dH/dt = -\\partial L/\\partial t$. Bevart når $L$ ikke avhenger eksplisitt av tida, og lik energien $T + V$ når føringene er tidsuavhengige og $V$ bare avhenger av koordinatene."
  - term: Kontinuerlig symmetri
    section: Symmetrier og bevarte størrelser
    definition: "Transformasjon $q_i \\to q_i + \\epsilon F_i(q, \\dot q, t)$ med en parameter $\\epsilon$ som kan gjøres vilkårlig liten, og som endrer $L$ med høyst en total tidsderivert $\\epsilon\\,dF/dt$ for alle baner. Forskyvning, rotasjon og Galilei-skifte er eksempler; speiling er det ikke, for den har ingen parameter."
  - term: Noethers teorem
    section: Symmetrier og bevarte størrelser
    definition: "Hver kontinuerlig symmetri av Lagrangefunksjonen gir en bevart størrelse. Forskyvningen $q_i \\to q_i + \\epsilon F_i$ er en symmetri når den endrer $L$ med høyst en total tidsderivert $\\epsilon\\,dF/dt$, og da er $\\sum_i p_i F_i - F$ bevart."
  - term: Effektivt potensial
    section: Symmetrier og bevarte størrelser
    definition: "Potensialet som står igjen for én koordinat når de bevarte størrelsene er satt inn i energien, som $p_\\phi^2/2\\mu r^2 + V(r)$ for radialbevegelsen i et sentralpotensial. Vendepunkter og likevekter leses ut av det som av et vanlig potensial."

  - term: Sentrifugalbarriere
    section: Tolegemeproblemet
    definition: "Leddet $J^2/2\\mu r^2$ i det effektive potensialet, den kinetiske energien i vinkelbevegelsen skrevet med den bevarte dreieimpulsen. Det vokser uten grense når $r \\to 0$ og holder legemet unna kraftsentrum så lenge $J \\ne 0$."
  - term: Eksentrisitet
    section: Tolegemeproblemet
    definition: "Tallet $e \\ge 0$ i kjeglesnittet $r = r_0/(1 + e\\cos\\phi)$. Det fastlegger formen på banen: $e = 0$ er en sirkel, $e < 1$ en ellipse, $e = 1$ en parabel og $e > 1$ en hyperbel. For $V = -k/r$ er $e^2 = 1 + 2EJ^2/\\mu k^2$."
  - term: Perihel
    section: Tolegemeproblemet
    definition: "Punktet i banen nærmest sola; det fjerneste er aphel. For en vilkårlig bane kalles de to vendepunktene i $r$ apsidene, $r_\\text{min} = a(1 - e)$ og $r_\\text{max} = a(1 + e)$ i en ellipse."
  - term: Støtparameter
    section: Tolegemeproblemet
    definition: "Avstanden $s$ fra kraftsentrum til den rette linja en innkommende partikkel følger langt ute. Sammen med energien gir den dreieimpulsen $J = s\\sqrt{2\\mu E}$ og bestemmer spredningsvinkelen $\\Theta$."
  - term: Spredningstverrsnitt
    section: Tolegemeproblemet
    definition: "Det differensielle spredningstverrsnittet $d\\sigma/d\\Omega$ er antall partikler spredt inn i romvinkelen $d\\Omega$ per tid, delt på antall innkommende partikler per tid og areal. Det har dimensjon areal, og integralet over alle retninger er det totale tverrsnittet."
  - term: Virialteoremet
    section: Tolegemeproblemet
    definition: "For et system som holder seg endelig er tidsmiddelet $2\\langle T\\rangle = -\\langle\\sum_i \\vec F_i \\cdot \\vec r_i\\rangle$. For et potensial som er homogent av grad $n$ er det $2\\langle T\\rangle = n\\langle V\\rangle$."

  - term: Jacobis konstant
    section: Trelegemeproblemet
    definition: "Den bevarte energifunksjonen per masse for det lette legemet i det begrensede trelegemeproblemet, $C = \\tfrac12 v'^2 + U$. $v'$ er farten i systemet som roterer med de to tunge legemene, og $U$ tar med sentrifugalpotensialet. Legemet kan bare være der $U \\le C$."
  - term: Lagrangepunkt
    section: Trelegemeproblemet
    definition: "Et av de fem likevektspunktene i det begrensede trelegemeproblemet, der et lett legeme står i ro i systemet som roterer med de to tunge legemene. $L_1$, $L_2$ og $L_3$ ligger på linja gjennom dem og er ustabile. $L_4$ og $L_5$ danner likesidede trekanter med dem og er stabile når $m_1/m_2 > 24{,}96$."

  - term: Normalmode
    section: Små svingninger
    definition: "En bevegelse nær en stabil likevekt der alle koordinatene svinger harmonisk med den samme frekvensen og i fast forhold til hverandre, $\\boldsymbol\\eta = \\mathbf A_n\\cos(\\omega_n t - \\delta_n)$. Enhver liten bevegelse er en sum av normalmoder."
  - term: Egenfrekvens
    section: Små svingninger
    definition: "Frekvensen $\\omega_n$ til en normalmode, en rot av sekulærligningen $\\det(\\boldsymbol V - \\omega^2\\boldsymbol T) = 0$."
  - term: Sekulærligning
    section: Små svingninger
    definition: "Ligningen $\\det(\\boldsymbol V - \\omega^2\\boldsymbol T) = 0$ for egenfrekvensene til små svingninger om en likevekt. Med $N$ frihetsgrader er den av grad $N$ i $\\omega^2$."
  - term: Normalkoordinat
    section: Små svingninger
    definition: "Utslaget $\\xi_n$ langs normalmode $n$, definert ved $\\boldsymbol\\eta = \\sum_n \\xi_n\\mathbf A_n$. I normalkoordinatene er Lagrangefunksjonen en sum av uavhengige harmoniske oscillatorer."
  - term: Dispersjonsrelasjon
    section: Små svingninger
    definition: "Sammenhengen mellom frekvensen og bølgelengden til en bølge. For en kjede av like atomer er den $\\omega = 2\\sqrt{k/m}\\,|\\sin(\\varphi/2)|$, med $\\varphi$ faseforskjellen mellom naboatomer."

  - term: Stivt legeme
    section: Stive legemer
    definition: "System av partikler der alle avstandene mellom partiklene er faste. Det har seks frihetsgrader, tre for et punkt i legemet og tre for orienteringen."
  - term: Treghetstensor
    section: Stive legemer
    definition: "Den symmetriske matrisen $I_{ab} = \\sum_i m_i(r_i^2\\delta_{ab} - x_{ia}x_{ib})$ om et punkt i legemet. Den gir dreieimpulsen $\\vec L = \\boldsymbol I\\vec\\omega$ og den kinetiske energien $\\tfrac12\\vec\\omega \\cdot \\boldsymbol I\\vec\\omega$."
  - term: Treghetsmoment
    section: Stive legemer
    definition: "Summen $I_{\\hat n} = \\sum_i m_i d_i^2$, der $d_i$ er avstanden fra partikkel $i$ til aksen $\\hat n$. Det er $\\hat n \\cdot \\boldsymbol I\\hat n$, og for rotasjon om aksen er $T = \\tfrac12 I_{\\hat n}\\omega^2$."
  - term: Hovedakse
    section: Stive legemer
    definition: "En egenvektor til treghetstensoren. Roterer legemet om en hovedakse, er $\\vec L$ parallell med $\\vec\\omega$. Symmetriakser og normaler til symmetriplan er hovedakser."
  - term: Hovedtreghetsmoment
    section: Stive legemer
    definition: "En egenverdi $I_1$, $I_2$ eller $I_3$ av treghetstensoren, altså treghetsmomentet om en hovedakse."
  - term: Parallellakseteoremet
    section: Stive legemer
    definition: "Treghetstensoren om et punkt $O$ er tensoren om massesenteret pluss tensoren til en punktmasse $M$ i massesenteret, $I_{ab} = I^{\\text{cm}}_{ab} + M(R^2\\delta_{ab} - R_aR_b)$. For parallelle akser er $I = I_\\text{cm} + Mh^2$. Teoremet heter også Steiners sats."
  - term: Fysisk pendel
    section: Stive legemer
    definition: "Et stivt legeme som svinger om en fast, vannrett akse som ikke går gjennom massesenteret. Små svingninger har $\\omega^2 = MgD/I_O$, der $D$ er avstanden fra aksen til massesenteret."
  - term: Rulling uten glidning
    section: Stive legemer
    definition: "Bevegelse der kontaktpunktet står i ro i forhold til underlaget. Langs ei linje gir det den holonome føringen $\\dot s = R\\dot\\theta$, og friksjonskraften gjør ikke arbeid."
  - term: Eulers ligninger
    section: Eulers ligninger og snurrebassen
    definition: "Bevegelsesligningene ${I_1\\dot\\omega_1 + (I_3 - I_2)\\,\\omega_2\\omega_3 = N_1}$ og de to sykliske ombyttingene, for komponentene av $\\vec\\omega$ langs hovedaksene. De er $\\dot{\\vec L} = \\vec N$ skrevet langs legemets akser."
  - term: Symmetrisk snurrebass
    section: Eulers ligninger og snurrebassen
    definition: "Stivt legeme med to like hovedtreghetsmomenter, $I_1 = I_2$. Hovedaksen $\\hat e_3'$ med det tredje er symmetriaksen."
  - term: Presesjon
    section: Eulers ligninger og snurrebassen
    definition: "Rotasjon av symmetriaksen om en fast retning, om $\\vec L$ for en fri snurrebass og om loddlinja for en tung."
  - term: Nutasjon
    section: Eulers ligninger og snurrebassen
    definition: "Svingningen i vinkelen $\\theta$ mellom loddlinja og symmetriaksen mens en tung snurrebass presesserer."
  - term: Rotasjonsmatrise
    section: Eulers ligninger og snurrebassen
    definition: "Matrisen $R_{ab} = \\hat e_a' \\cdot \\hat e_b$ mellom to sett akser. Den er ortogonal, $\\boldsymbol R\\boldsymbol R^{\\mathsf T} = \\boldsymbol 1$, og har determinant $+1$. Rotasjonene danner gruppen SO(3), og en ortogonal matrise med determinant $-1$ inneholder en speiling."
  - term: Eulervinkler
    section: Eulers ligninger og snurrebassen
    definition: "Tre vinkler $\\phi$, $\\theta$ og $\\psi$ som gir orienteringen til et stivt legeme som tre dreininger etter hverandre, $\\phi$ om rommets $\\hat e_3$, $\\theta$ om knutelinja og $\\psi$ om legemets $\\hat e_3'$."
  - term: Knutelinje
    section: Eulers ligninger og snurrebassen
    definition: "Skjæringslinja mellom rommets $\\hat e_1\\hat e_2$-plan og legemets $\\hat e_1'\\hat e_2'$-plan. Den andre Eulervinkelen $\\theta$ er en dreining om den."
  - term: Sovende snurrebass
    section: Eulers ligninger og snurrebassen
    definition: "En tung snurrebass som spinner rett opp, $\\theta = 0$. Den står stabilt når $I_3^2\\omega_3^2 > 4I_1Mgl$."

