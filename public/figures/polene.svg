  <path d="M 265 160 L 254 154.5 L 254 165.5 Z" fill="#3f9a6c"/>
  <g stroke="#c0703a" stroke-width="2.4"><line x1="94" y1="167" x2="106" y2="179"/><line x1="94" y1="179" x2="106" y2="167"/></g>
  <g stroke="#c0703a" stroke-width="2.4"><line x1="234" y1="167" x2="246" y2="179"/><line x1="234" y1="179" x2="246" y2="167"/></g>
  <text x="240" y="199" font-family="KaTeX_Math, 'Times New Roman', serif" font-style="italic" font-size="16" fill="#c0703a" text-anchor="middle">ω<tspan dy="5" font-size="12">0</tspan><tspan dy="-5"><tspan font-family="KaTeX_Main, 'Times New Roman', serif" font-style="normal"> − </tspan>iε</tspan></text>
  <text x="100" y="199" font-family="KaTeX_Math, 'Times New Roman', serif" font-style="italic" font-size="16" fill="#c0703a" text-anchor="middle"><tspan font-family="KaTeX_Main, 'Times New Roman', serif" font-style="normal">−</tspan>ω<tspan dy="5" font-size="12">0</tspan><tspan dy="-5"><tspan font-family="KaTeX_Main, 'Times New Roman', serif" font-style="normal"> − </tspan>iε</tspan></text>
  <text x="178" y="98" font-family="KaTeX_Math, 'Times New Roman', serif" font-style="italic" font-size="17" fill="#7c8795" text-anchor="start">τ<tspan font-family="KaTeX_Main, 'Times New Roman', serif" font-style="normal"> &lt; 0</tspan></text>
  <text x="178" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#7c8795" text-anchor="start">ingen poler</text>
  <text x="178" y="218" font-family="KaTeX_Math, 'Times New Roman', serif" font-style="italic" font-size="17" fill="#3f9a6c" text-anchor="start">τ<tspan font-family="KaTeX_Main, 'Times New Roman', serif" font-style="normal"> &gt; 0</tspan></text>
  <text x="178" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#3f9a6c" text-anchor="start">to poler</text>
