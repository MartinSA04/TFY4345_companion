  <g stroke="#8d98a6" stroke-width="1.2">
    <line x1="32" y1="160" x2="310" y2="160" marker-end="url(#ax)"/>
    <line x1="170" y1="294" x2="170" y2="24" marker-end="url(#ax)"/>
  </g>
  <text x="336" y="184" font-family="KaTeX_Math, 'Times New Roman', serif" font-style="italic" font-size="16" fill="#7c8795" text-anchor="end"><tspan font-family="KaTeX_Main, 'Times New Roman', serif" font-style="normal">Re </tspan>Ω</text>
  <text x="178" y="34" font-family="KaTeX_Math, 'Times New Roman', serif" font-style="italic" font-size="16" fill="#7c8795" text-anchor="start"><tspan font-family="KaTeX_Main, 'Times New Roman', serif" font-style="normal">Im </tspan>Ω</text>
